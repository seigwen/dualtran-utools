<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DualTran</title>
  <link rel="stylesheet" href="dist/style.css" />
  <style>
    select.lang { width: 136px; }
    #settings label {
      display: grid; grid-template-columns: 76px 1fr; align-items: center;
      gap: 8px; margin: 5px 0; color: #8a8a94; font-size: 12px;
    }
    #settings input, #settings select { width: 100%; }
    #settings label[hidden] { display: none; }
    #settings .hint { margin: 2px 0 6px; color: #8a8a94; font-size: 11px; }
    #settings .catalog { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #settings .catalog button { padding: 2px 8px; font-size: 11px; }
    .status.busy::before {
      content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 6px;
      border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
      animation: dt-spin .8s linear infinite; vertical-align: -1px;
    }
    @keyframes dt-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="bar">
      <span class="brand">DualTran</span>
      <select id="engine" title="Engine"><option value="google">Google</option><option value="ai">AI (BYOK)</option></select>
      <select id="source" class="lang" title="Source language"></select>
      <span class="arrow">&#8594;</span>
      <select id="target" class="lang" title="Target language"></select>
    </header>
    <textarea id="input" placeholder="Type or paste text — or select text anywhere and pick 翻译 in the uTools panel." spellcheck="false"></textarea>
    <div class="actions">
      <button id="translate">Translate</button>
      <button id="copy" disabled>Copy</button>
      <span id="status" class="status"></span>
    </div>
    <pre id="result" class="result"></pre>
    <details id="settings">
      <summary>AI settings (BYOK)</summary>
      <label>服务商 <select id="aiProvider"></select></label>
      <div class="catalog">
        <span id="catalogState" class="hint">模型目录：未加载</span>
        <button id="refreshCatalog" type="button">刷新</button>
      </div>
      <label>Endpoint <input id="aiBaseUrl" placeholder="https://api.openai.com/v1" /></label>
      <label>Model <select id="aiModelSelect"></select></label>
      <label>推理强度 <select id="aiReasoning"></select></label>
      <label id="customModelRow" hidden>模型名 <input id="aiModel" placeholder="例如 gpt-4o-mini" /></label>
      <label>API key <input id="aiApiKey" type="password" placeholder="sk-..." /></label>
      <p class="hint">服务商与模型列表来自 models.dev（缓存 24 小时）。endpoint 与 model 都可手动覆盖。</p>
    </details>
  </main>
  <script>
  /* The page does the network work: the browser's stack reaches Google from this
     machine while Node's raw sockets time out. The preload only forwards the
     selected text uTools passes on entry. */
  (function () {
    var SETTINGS_KEY = "dualtran.settings";
    var CATALOG_KEY = "dualtran.modelsdev.v2";
    var CATALOG_TTL = 24 * 60 * 60 * 1000;
    var CATALOG_URL = "https://models.dev/api.json";

    var LANGUAGES = [
      ["zh-CN", "简体中文"], ["zh-TW", "繁體中文"], ["en", "English"], ["ja", "日本語"],
      ["ko", "한국어"], ["fr", "Français"], ["de", "Deutsch"], ["es", "Español"],
      ["ru", "Русский"], ["pt", "Português"], ["it", "Italiano"], ["ar", "العربية"],
      ["hi", "हिन्दी"], ["th", "ไทย"], ["vi", "Tiếng Việt"], ["id", "Bahasa Indonesia"],
      ["tr", "Türkçe"], ["nl", "Nederlands"], ["pl", "Polski"], ["uk", "Українська"]
    ];

    // Offline fallback; the live list comes from models.dev.
    var BUILTIN = [
      { id: "openai", name: "OpenAI", base: "https://api.openai.com/v1", model: "gpt-4o-mini", dev: "openai" },
      { id: "deepseek", name: "DeepSeek", base: "https://api.deepseek.com/v1", model: "deepseek-chat", dev: "deepseek" },
      { id: "moonshot", name: "Moonshot / Kimi", base: "https://api.moonshot.cn/v1", model: "moonshot-v1-8k", dev: "moonshotai" },
      { id: "zhipu", name: "智谱 GLM", base: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4-flash", dev: "zhipuai" },
      { id: "qwen", name: "通义千问", base: "https://dashscope.aliyuncs.com/compatible-mode/v1", model: "qwen-plus", dev: "alibaba-cn" },
      { id: "siliconflow", name: "硅基流动", base: "https://api.siliconflow.cn/v1", model: "Qwen/Qwen2.5-7B-Instruct", dev: "siliconflow" },
      { id: "groq", name: "Groq", base: "https://api.groq.com/openai/v1", model: "llama-3.3-70b-versatile", dev: "groq" },
      { id: "openrouter", name: "OpenRouter", base: "https://openrouter.ai/api/v1", model: "openai/gpt-4o-mini", dev: "openrouter" },
      { id: "together", name: "Together AI", base: "https://api.together.xyz/v1", model: "meta-llama/Llama-3.3-70B-Instruct-Turbo", dev: "togetherai" },
      { id: "mistral", name: "Mistral AI", base: "https://api.mistral.ai/v1", model: "mistral-small-latest", dev: "mistral" },
      { id: "ollama", name: "Ollama（本机）", base: "http://127.0.0.1:11434/v1", model: "qwen2.5:7b", dev: "ollama" },
      { id: "lmstudio", name: "LM Studio（本机）", base: "http://127.0.0.1:1234/v1", model: "local-model", dev: "lmstudio" },
      { id: "custom", name: "自定义", base: "", model: "", dev: "" }
    ];

    var el = {
      engine: document.getElementById("engine"),
      source: document.getElementById("source"),
      target: document.getElementById("target"),
      input: document.getElementById("input"),
      translate: document.getElementById("translate"),
      copy: document.getElementById("copy"),
      status: document.getElementById("status"),
      result: document.getElementById("result"),
      aiProvider: document.getElementById("aiProvider"),
      aiBaseUrl: document.getElementById("aiBaseUrl"),
      aiModelSelect: document.getElementById("aiModelSelect"),
      aiModel: document.getElementById("aiModel"),
      customModelRow: document.getElementById("customModelRow"),
      aiApiKey: document.getElementById("aiApiKey"),
      catalogState: document.getElementById("catalogState"),
      refreshCatalog: document.getElementById("refreshCatalog")
    };

    el.aiReasoning = document.getElementById("aiReasoning");

    var REASONING_LOWEST = "__lowest__";
    var REASONING_ORDER = ["none", "minimal", "low", "medium", "high", "xhigh", "max"];

    /** Declared effort levels for the current model (models.dev projection). */
    /** models.dev id behind the current dropdown value (built-ins alias one). */
    function devIdOf(value) {
      var v = providerValueOf(value);
      if (v.indexOf("c:") === 0) return v.slice(2);
      var builtIn = builtinById(v.slice(2));
      return (builtIn && builtIn.dev) || v.slice(2);
    }

    function reasoningValuesFor() {
      if (!catalog) return [];
      // Declarations live under the models.dev id, which a built-in only aliases.
      var entry = catalog[devIdOf(el.aiProvider.value)];
      return (entry && entry.reasoning && entry.reasoning[currentModelValue()]) || [];
    }

    /** Lowest first, then provider default, then the declared levels. */
    function renderReasoning() {
      var current = el.aiReasoning.value || REASONING_LOWEST;
      var declared = reasoningValuesFor();
      var values = REASONING_ORDER.filter(function (level) { return declared.indexOf(level) >= 0; });
      var html = [
        '<option value="' + REASONING_LOWEST + '">最低（默认）</option>',
        '<option value="">服务商默认</option>'
      ];
      values.forEach(function (level) { html.push('<option value="' + level + '">' + level + "</option>"); });
      el.aiReasoning.innerHTML = html.join("");
      var still = Array.prototype.some.call(el.aiReasoning.options, function (o) { return o.value === current; });
      el.aiReasoning.value = still ? current : REASONING_LOWEST;
    }

    /** Sentinels resolved at request time; "" means "send no reasoning parameter". */
    function resolveReasoning() {
      var setting = el.aiReasoning.value || REASONING_LOWEST;
      if (setting !== REASONING_LOWEST) return setting;
      var declared = reasoningValuesFor();
      var ladder = ["none", "minimal", "low"];
      for (var i = 0; i < ladder.length; i++) {
        if (declared.indexOf(ladder[i]) >= 0) return ladder[i];
      }
      return "";
    }

    var catalog = null;            // { [devId]: { name, api, models: [[id, name], ...], reasoning } }
    var catalogTs = 0;
    var lastDefaults = { base: "", model: "" };

    // ── languages ──────────────────────────────────────────────
    function fillLanguages() {
      el.source.innerHTML = '<option value="auto">自动检测</option>' +
        LANGUAGES.map(function (l) {
          return '<option value="' + l[0] + '">' + l[1] + " " + l[0] + "</option>";
        }).join("");
      el.target.innerHTML = LANGUAGES.map(function (l) {
        return '<option value="' + l[0] + '">' + l[1] + " " + l[0] + "</option>";
      }).join("");
    }

    // ── models.dev catalog ─────────────────────────────────────
    function normalizeBase(api) {
      var u = String(api || "").trim().replace(/\/+$/, "");
      u = u.replace(/\/chat\/completions$/, "");
      if (!/\/v\d+(beta|alpha)?$/i.test(u)) u += "/v1";
      return u;
    }

    function readCatalogCache() {
      try {
        var raw = JSON.parse(localStorage.getItem(CATALOG_KEY) || "null");
        if (raw && raw.data && raw.data.providers) return raw;
      } catch (e) {}
      return null;
    }

    function projectCatalog(data) {
      var out = {};
      Object.keys(data).forEach(function (id) {
        var p = data[id];
        // models.dev omits `api` for OpenAI/Anthropic/Google; keep the entry so a
        // built-in can read their model list and reasoning declarations.
        if (!p || !p.models) return;
        var models = [];
        var reasoning = {};
        Object.keys(p.models).forEach(function (mid) {
          var m = p.models[mid] || {};
          models.push([mid, m.name || mid]);
          var options = Array.isArray(m.reasoning_options) ? m.reasoning_options : [];
          var effort = options.filter(function (o) { return o && o.type === "effort"; })[0];
          if (effort && Array.isArray(effort.values) && effort.values.length) {
            reasoning[mid] = effort.values.slice();
          } else if (options.some(function (o) { return o && o.type === "toggle"; })) {
            reasoning[mid] = ["high"];
          }
        });
        if (!models.length) return;
        out[id] = { name: p.name || id, api: p.api || "", models: models, reasoning: reasoning };
      });
      return out;
    }

    function setCatalogState(text) {
      el.catalogState.textContent = text;
    }

    function applyCatalog(providers, ts) {
      catalog = providers;
      catalogTs = ts;
      var n = Object.keys(providers).length;
      setCatalogState("模型目录：已载入 " + n + " 个服务商");
      renderProviders();
      renderModels();
      renderReasoning();
      // The saved provider may be a models.dev id that only exists now; restore()
      // is idempotent and re-selects it after the dropdown has the full list.
      restore();
    }

    function loadCatalog(force) {
      if (!force) {
        var cached = readCatalogCache();
        if (cached) {
          applyCatalog(cached.data.providers, cached.ts || 0);
          if (Date.now() - (cached.ts || 0) < CATALOG_TTL) return;
        }
      }
      setCatalogState("模型目录：加载中…");
      fetch(CATALOG_URL)
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          var providers = projectCatalog(data);
          var ts = Date.now();
          try {
            var payload = JSON.stringify({ ts: ts, data: { providers: providers } });
            if (payload.length < 4000000) localStorage.setItem(CATALOG_KEY, payload);
          } catch (e) { /* quota — live without the cache */ }
          applyCatalog(providers, ts);
        })
        .catch(function (e) {
          if (catalog) setCatalogState("模型目录：离线（缓存 " + Object.keys(catalog).length + " 项）");
          else setCatalogState("模型目录：加载失败 " + ((e && e.message) || ""));
        });
    }

    // ── provider / model selects ───────────────────────────────
    function providerValueOf(id) {
      return id.indexOf("c:") === 0 || id.indexOf("b:") === 0 ? id : "b:" + id;
    }

    function builtinById(id) {
      for (var i = 0; i < BUILTIN.length; i++) if (BUILTIN[i].id === id) return BUILTIN[i];
      return BUILTIN[BUILTIN.length - 1];
    }

    function renderProviders() {
      var current = el.aiProvider.value || "b:openai";
      var opts = BUILTIN.map(function (p) {
        return '<option value="b:' + p.id + '">' + p.name + "</option>";
      });
      if (catalog) {
        var ids = Object.keys(catalog).sort(function (a, b) {
          return (catalog[a].name || a).localeCompare(catalog[b].name || b);
        });
        if (ids.length) {
          opts.push('<option disabled>── more ──</option>');
          ids.forEach(function (id) {
            if (!catalog[id].api) return; // no endpoint to call; only useful as a built-in alias
            if (BUILTIN.some(function (b) { return b.dev === id; })) return; // already listed above
            opts.push('<option value="c:' + id + '">' + (catalog[id].name || id) + "</option>");
          });
        }
      }
      el.aiProvider.innerHTML = opts.join("");
      // keep the previous selection if it still exists
      var still = Array.prototype.some.call(el.aiProvider.options, function (o) { return o.value === current; });
      el.aiProvider.value = still ? current : "b:openai";
    }

    function modelsForCurrentProvider() {
      var v = providerValueOf(el.aiProvider.value);
      if (v.indexOf("c:") === 0) {
        var id = v.slice(2);
        return (catalog && catalog[id] && catalog[id].models) || [];
      }
      var b = builtinById(v.slice(2));
      var devId = b.dev;
      if (catalog && devId && catalog[devId]) return catalog[devId].models;
      return b.model ? [[b.model, b.model]] : [];
    }

    function currentModelValue() {
      return el.aiModelSelect.value === "__custom__"
        ? el.aiModel.value.trim()
        : el.aiModelSelect.value;
    }

    function setModelValue(value) {
      var models = modelsForCurrentProvider();
      var known = models.some(function (m) { return m[0] === value; });
      var opts = models.map(function (m) {
        return '<option value="' + m[0] + '">' + m[1] + "</option>";
      });
      opts.push('<option value="__custom__">自定义…</option>');
      el.aiModelSelect.innerHTML = opts.join("");
      if (value && known) {
        el.aiModelSelect.value = value;
        el.aiModel.value = value;
        el.customModelRow.hidden = true;
      } else if (value) {
        el.aiModelSelect.value = "__custom__";
        el.aiModel.value = value;
        el.customModelRow.hidden = false;
      } else if (models.length) {
        el.aiModelSelect.value = models[0][0];
        el.aiModel.value = models[0][0];
        el.customModelRow.hidden = true;
      } else {
        el.aiModelSelect.value = "__custom__";
        el.customModelRow.hidden = false;
      }
    }

    function renderModels() {
      setModelValue(el.aiModel.value.trim());
    }

    function applyProviderDefaults(value) {
      var v = providerValueOf(value);
      var base = "";
      var model = "";
      if (v.indexOf("c:") === 0) {
        var entry = catalog && catalog[v.slice(2)];
        if (entry) {
          base = normalizeBase(entry.api);
          model = entry.models.length ? entry.models[0][0] : "";
        }
      } else {
        var b = builtinById(v.slice(2));
        base = b.base;
        model = b.model;
      }
      el.aiBaseUrl.value = base;
      // Switching provider is an explicit choice: follow its default model. The user
      // can still pick 自定义 afterwards and type anything.
      setModelValue(model);
      // The built-in default may no longer exist upstream; fall back to the first
      // model the catalog lists for this provider.
      var list = modelsForCurrentProvider();
      if (el.aiModelSelect.value === "__custom__" && list.length) setModelValue(list[0][0]);
      lastDefaults = { base: base, model: model };
    }

    // ── settings persistence ───────────────────────────────────
    function say(text, bad, busy) {
      el.status.textContent = text || "";
      el.status.className = "status" + (bad ? " error" : "") + (busy ? " busy" : "");
    }

    function settings() {
      return {
        engine: el.engine.value,
        sourceLanguage: el.source.value || "auto",
        targetLanguage: el.target.value || "zh-CN",
        aiProvider: el.aiProvider.value,
        aiBaseUrl: el.aiBaseUrl.value.trim(),
        aiModel: currentModelValue(),
        aiReasoning: el.aiReasoning.value || REASONING_LOWEST,
        aiApiKey: el.aiApiKey.value.trim()
      };
    }

    function remember() {
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings())); } catch (e) {}
    }

    function restore() {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null"); } catch (e) {}
      if (!saved) return;
      if (saved.engine) el.engine.value = saved.engine;
      if (saved.sourceLanguage) el.source.value = saved.sourceLanguage;
      if (saved.targetLanguage) el.target.value = saved.targetLanguage;
      if (saved.aiProvider) el.aiProvider.value = providerValueOf(saved.aiProvider);
      if (saved.aiBaseUrl) el.aiBaseUrl.value = saved.aiBaseUrl;
      if (saved.aiModel) { el.aiModel.value = saved.aiModel; setModelValue(saved.aiModel); }
      // Rebuild the levels for the restored model before selecting the saved one,
      // otherwise the value has no matching option and silently becomes "".
      renderReasoning();
      if (saved.aiReasoning) el.aiReasoning.value = saved.aiReasoning;
      if (saved.aiApiKey) el.aiApiKey.value = saved.aiApiKey;
    }

    // ── engines ───────────────────────────────────────────────
    function chunk(text, size) {
      var out = [], buf = "";
      var parts = text.split(/(?<=[.!?。！？\n])/);
      for (var i = 0; i < parts.length; i++) {
        if ((buf + parts[i]).length > size && buf) { out.push(buf); buf = parts[i]; }
        else buf += parts[i];
      }
      if (buf) out.push(buf);
      return out.length ? out : [text];
    }

    function google(text, source, target) {
      var pieces = chunk(text, 1800);
      var done = [];
      return pieces.reduce(function (chain, piece) {
        return chain.then(function () {
          var url = "https://translate.googleapis.com/translate_a/single?client=gtx" +
            "&sl=" + encodeURIComponent(source) + "&tl=" + encodeURIComponent(target) +
            "&dt=t&q=" + encodeURIComponent(piece);
          return fetch(url).then(function (res) {
            if (!res.ok) throw new Error("Google HTTP " + res.status);
            return res.json();
          }).then(function (data) {
            done.push((data[0] || []).map(function (seg) { return seg[0]; }).join(""));
          });
        });
      }, Promise.resolve()).then(function () { return done.join("\n"); });
    }

    function ai(text, target, cfg) {
      if (!cfg.aiBaseUrl || !cfg.aiModel || !cfg.aiApiKey) {
        return Promise.reject(new Error("AI mode needs endpoint, model and key (open AI settings)."));
      }
      var reasoning = resolveReasoning();
      var base = cfg.aiBaseUrl.replace(/\/+$/, "");
      var targetUrl = /\/chat\/completions$/.test(base) ? base : base + "/chat/completions";
      return fetch(targetUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.aiApiKey },
        body: JSON.stringify(Object.assign({
          model: cfg.aiModel,
          temperature: 0.2,
          messages: [
            { role: "system", content: "Translate into " + target + ". Output only the translation, keep line breaks." },
            { role: "user", content: text }
          ]
        }, reasoning ? { reasoning_effort: reasoning } : {}))
      }).then(function (res) {
        if (!res.ok) throw new Error("AI HTTP " + res.status);
        return res.json();
      }).then(function (data) {
        return (((data.choices || [])[0] || {}).message || {}).content || "";
      });
    }

    function run() {
      var text = el.input.value.trim();
      if (!text) { say("Nothing to translate."); return; }
      var cfg = settings();
      remember();
      el.translate.disabled = true;
      el.copy.disabled = true;
      el.result.textContent = "";
      say("Translating…", false, true);
      var job = cfg.engine === "ai"
        ? ai(text, cfg.targetLanguage, cfg)
        : google(text, cfg.sourceLanguage, cfg.targetLanguage);
      job.then(function (out) {
        el.result.textContent = out;
        el.copy.disabled = !out;
        say(out ? "Done." : "Empty translation.");
      }).catch(function (e) {
        say(String((e && e.message) || e), true);
      }).then(function () {
        el.translate.disabled = false;
      });
    }

    // ── wiring ────────────────────────────────────────────────
    fillLanguages();
    el.target.value = "zh-CN";
    renderProviders();
    restore();
    if (!el.aiBaseUrl.value.trim()) applyProviderDefaults(el.aiProvider.value);
    else renderModels();
    renderReasoning();

    el.aiProvider.addEventListener("change", function () {
      applyProviderDefaults(el.aiProvider.value);
      renderReasoning();
      remember();
    });
    el.aiModelSelect.addEventListener("change", function () {
      if (el.aiModelSelect.value === "__custom__") {
        el.customModelRow.hidden = false;
        el.aiModel.focus();
      } else {
        el.aiModel.value = el.aiModelSelect.value;
        el.customModelRow.hidden = true;
      }
      renderReasoning();
      remember();
    });
    el.aiModel.addEventListener("input", renderReasoning);
    el.aiModel.addEventListener("change", function () { renderReasoning(); remember(); });
    el.refreshCatalog.addEventListener("click", function (e) {
      e.preventDefault();
      try { localStorage.removeItem(CATALOG_KEY); } catch (err) {}
      loadCatalog(true);
    });
    el.engine.addEventListener("change", function () {
      if (el.engine.value === "ai" && !el.aiApiKey.value.trim()) {
        document.getElementById("settings").open = true;
      }
      remember();
    });
    el.translate.addEventListener("click", run);
    el.copy.addEventListener("click", function () {
      try { utools.copyText(el.result.textContent); }
      catch (e) { if (navigator.clipboard) navigator.clipboard.writeText(el.result.textContent); }
    });
    el.input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run();
    });
    [el.engine, el.source, el.target, el.aiBaseUrl, el.aiApiKey].forEach(function (node) {
      node.addEventListener("change", remember);
    });

    // uTools hands the entry text over from the preload (preload/enterText.js):
    //   - a text-bearing entry (划词 / 粘贴的文本 / `dt 文本`) arrives as "input";
    //   - a bare keyword entry arrives as "focus" — uTools carries no text there.
    // The preload re-posts until we ack, so ack after handling and drop an
    // identical retry instead of translating the same text twice.
    var lastEntry = { text: "", at: 0 };
    function ackEntry() {
      window.postMessage({ __dualtran: true, type: "ack" }, "*");
    }
    window.addEventListener("message", function (event) {
      var msg = event && event.data;
      if (!msg || msg.__dualtran !== true) return;
      if (msg.type === "input" && typeof msg.text === "string" && msg.text) {
        var at = Date.now();
        if (msg.text === lastEntry.text && at - lastEntry.at < 2000) { ackEntry(); return; }
        lastEntry = { text: msg.text, at: at };
        el.input.value = msg.text;
        ackEntry();
        run();
      } else if (msg.type === "focus") {
        el.input.focus();
        say("没有带入文本：选中文字后按鼠标中键选「翻译」，或复制/粘贴后再翻译。");
      }
    });
    window.postMessage({ __dualtran: true, type: "ready" }, "*");

    loadCatalog(false);
    try { utools.setExpendHeight(620); } catch (e) {}
  })();
  </script>
