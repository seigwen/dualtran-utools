<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DualTran</title>
  <link rel="stylesheet" href="dist/style.css" />
  <style>/* fixed-size: give the window intrinsic dimensions */
    html, body { width: 560px; height: 620px; overflow: hidden; }
    .wrap { height: 620px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="bar">
      <span class="brand">DualTran</span>
      <select id="engine" title="Engine">
        <option value="google">Google</option>
        <option value="ai">AI (BYOK)</option>
      </select>
      <input id="source" class="lang" title="Source language" size="4" value="auto" />
      <span class="arrow">&#8594;</span>
      <input id="target" class="lang" title="Target language" size="4" value="zh-CN" />
    </header>

    <textarea id="input" placeholder="Type text or enter with selected text..." spellcheck="false"></textarea>

    <div class="actions">
      <button id="translate">Translate</button>
      <button id="copy" disabled>Copy</button>
      <span id="status" class="status"></span>
    </div>

    <pre id="result" class="result"></pre>
  </main>
  </body>
</html>
